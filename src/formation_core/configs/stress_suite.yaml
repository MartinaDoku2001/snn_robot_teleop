# STRESS SUITE: faster leader, sharper path, more process noise. Same task,
# harder information demand -- used to check that conclusions hold when the
# predictor degrades faster.
name: stress
description: Faster leader, sharper turns, larger process noise.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
episode:
  # Default single episode: oval path, analytic follower, always transmit.
  # Every field here is part of the reproducibility contract.
  seed: 0
  dt: 0.05              # 20 Hz control, matches the Gazebo adapter's rate
  duration: 60.0        # seconds -> 1200 steps, ~2 laps of the default oval
  offset_d: 0.8         # follower holds 0.8 m directly behind the leader

  path:
    name: oval          # straights (zero curvature) + semicircular caps (1/1.5 m)
    straight_length: 3.0
    radius: 1.0

  noise:                # bounded, correlated (AR1) process noise on the leader
    v_bound: 0.10       # m/s
    w_bound: 0.30       # rad/s
    correlation: 0.9

  limits:
    v_max: 1.0
    w_max: 2.0
    a_max: 2.0
    alpha_max: 6.0

  contract:             # normalization for the frozen obs/action contract
    max_range: 3.0
    v_max: 1.0
    w_max: 2.0

  leader:
    target_speed: 0.9
    lookahead: 0.5
    lookahead_gain: 0.3
    curvature_slowdown: 0.6

  controller:
    name: analytic

  policy:
    name: always

  predictor:
    name: constant_velocity

  reward:               # unused by the analytic controller; here for the RL phase
    w_formation: 1.0
    w_heading: 0.1
    w_comm: 0.0
    w_action: 0.0

  max_formation_error: 5.0
  start_offset: 0.0
